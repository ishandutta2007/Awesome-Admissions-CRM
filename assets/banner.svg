<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1.5deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-7px) scale(1.02); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes shimmer {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes waveMotion {
        0% { transform: translateX(0); }
        50% { transform: translateX(-25px); }
        100% { transform: translateX(0); }
      }
      .floating-card-1 { animation: floatSlow 6s ease-in-out infinite; }
      .floating-card-2 { animation: floatFast 4.5s ease-in-out infinite 1s; }
      .glowing-orb-1 { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
      .glowing-orb-2 { animation: pulseGlow 7s ease-in-out infinite 2s; transform-origin: center; }
      .wave-line { stroke-dasharray: 12 8; animation: shimmer 20s linear infinite; }
      .wave-bg { animation: waveMotion 8s ease-in-out infinite; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Ambient Lights -->
  <circle class="glowing-orb-1" cx="200" cy="100" r="140" fill="#6366f1" opacity="0.35" filter="url(#softGlow)" />
  <circle class="glowing-orb-2" cx="1050" cy="260" r="150" fill="#ec4899" opacity="0.3" filter="url(#softGlow)" />
  <circle class="glowing-orb-1" cx="900" cy="80" r="120" fill="#06b6d4" opacity="0.25" filter="url(#softGlow)" />

  <!-- Decorative Grid Patterns -->
  <g opacity="0.12">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4" />
    <path d="M 150,0 L 150,360 M 300,0 L 300,360 M 450,0 L 450,360 M 600,0 L 600,360 M 750,0 L 750,360 M 900,0 L 900,360 M 1050,0 L 1050,360" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Dynamic Wave Lines -->
  <g class="wave-bg" opacity="0.25">
    <path class="wave-line" d="M -50,280 Q 200,180 450,260 T 950,220 T 1250,290" fill="none" stroke="url(#primaryGrad)" stroke-width="3" />
    <path class="wave-line" d="M -50,310 Q 250,220 550,290 T 1050,250 T 1250,320" fill="none" stroke="url(#cyanGrad)" stroke-width="2" />
  </g>

  <!-- Left Content: Header & Titles -->
  <g transform="translate(60, 0)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 48)">
      <rect width="210" height="32" rx="16" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1.5" />
      <circle cx="16" cy="16" r="5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="432" y="21" fill="#c7d2fe" font-size="13" class="badge-text" letter-spacing="0.5">ADMISSIONS CRM HUB</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="400" y="132" fill="url(#primaryGrad)" font-size="46" class="title-text" filter="url(#glow)" letter-spacing="-1">
      Awesome Admissions CRM
    </text>

    <!-- Subtitle -->
    <text x="400" y="172" fill="#f8fafc" font-size="20" class="subtitle-text" font-weight="600">
      Curated Index of SaaS Platforms &amp; Open-Source Ecosystems
    </text>

    <!-- Description / Feature List -->
    <text x="400" y="212" fill="#94a3b8" font-size="14" class="subtitle-text">
      🎓 Student Recruitment • ⚡ Inquiry Pipelines • 📋 Application Tracking • 💬 Omnichannel Engagement
    </text>

    <!-- Stats / Meta Badges -->
    <g transform="translate(0, 248)">
      <!-- Badge 1 -->
      <rect width="135" height="38" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="414" y="24" fill="#38bdf8" font-size="16" class="badge-text">🏢 Top SaaS</text>
      <text x="96" y="24" fill="#e2e8f0" font-size="13" class="badge-text">10+</text>

      <!-- Badge 2 -->
      <rect x="548" width="165" height="38" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="562" y="24" fill="#a855f7" font-size="16" class="badge-text">⭐ Open-Source</text>
      <text x="674" y="24" fill="#e2e8f0" font-size="13" class="badge-text">14+</text>

      <!-- Badge 3 -->
      <rect x="726" width="155" height="38" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.12)" />
      <text x="740" y="24" fill="#ec4899" font-size="16" class="badge-text">💰 Pricing &amp; Tier</text>
      <text x="844" y="24" fill="#e2e8f0" font-size="13" class="badge-text">2026</text>
    </g>
  </g>

  <!-- Right Floating Visual Graphic: Interactive Dashboard Preview Mock -->
  <g class="floating-card-1" transform="translate(820, 50)">
    <!-- Glassmorphic Card Container -->
    <rect width="320" height="230" rx="16" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    
    <!-- Top Bar -->
    <rect width="320" height="36" rx="16" fill="rgba(255, 255, 255, 0.04)" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="36" cy="18" r="5" fill="#eab308" opacity="0.8" />
    <circle cx="52" cy="18" r="5" fill="#22c55e" opacity="0.8" />
    <rect x="100" y="11" width="120" height="14" rx="7" fill="rgba(255, 255, 255, 0.08)" />

    <!-- Mini Funnel Chart Metric -->
    <g transform="translate(20, 50)">
      <text x="200" y="15" fill="#94a3b8" font-size="11" class="badge-text">ADMISSIONS FUNNEL YIELD</text>
      <text x="200" y="38" fill="#ffffff" font-size="22" class="title-text">+34.8%</text>
      
      <!-- Progress / Funnel Bars -->
      <g transform="translate(0, 50)">
        <rect width="280" height="8" rx="4" fill="rgba(255, 255, 255, 0.08)" />
        <rect width="250" height="8" rx="4" fill="url(#cyanGrad)">
          <animate attributeName="width" values="0;250" dur="1.5s" fill="freeze" />
        </rect>
        <text x="200" y="24" fill="#94a3b8" font-size="10" class="subtitle-text">Inquiries (12,450)</text>

        <rect y="32" width="280" height="8" rx="4" fill="rgba(255, 255, 255, 0.08)" />
        <rect y="32" width="180" height="8" rx="4" fill="url(#primaryGrad)">
          <animate attributeName="width" values="0;180" dur="1.8s" fill="freeze" />
        </rect>
        <text x="200" y="56" fill="#94a3b8" font-size="10" class="subtitle-text">Applications (4,820)</text>

        <rect y="64" width="280" height="8" rx="4" fill="rgba(255, 255, 255, 0.08)" />
        <rect y="64" width="115" height="8" rx="4" fill="#10b981">
          <animate attributeName="width" values="0;115" dur="2.1s" fill="freeze" />
        </rect>
        <text x="200" y="88" fill="#94a3b8" font-size="10" class="subtitle-text">Enrolled Students (1,950)</text>
      </g>
    </g>
  </g>

  <!-- Secondary Floating Mini Pill -->
  <g class="floating-card-2" transform="translate(760, 240)">
    <rect width="190" height="46" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <circle cx="24" cy="23" r="10" fill="#6366f1" opacity="0.3" />
    <text x="18" y="28" fill="#a5b4fc" font-size="14">⚡</text>
    <text x="44" y="21" fill="#ffffff" font-size="12" class="badge-text">AI Automation</text>
    <text x="44" y="36" fill="#94a3b8" font-size="10" class="subtitle-text">Active Pipelines</text>
  </g>
</svg>